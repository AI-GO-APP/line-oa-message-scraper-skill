# PR 發布檢查：main 上的 VERSION 就是「已發布版本」，使用者端的 check_update.py 只看它。
# 改到 Skill 內容卻沒 bump VERSION，合併後沒有任何人會收到更新——這支檢查就是擋這件事。
name: release-check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 語法檢查
        run: |
          python -m py_compile scripts/*.py
          node --check scripts/crawl_in_page.js

      - name: VERSION 與 CHANGELOG
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'EOF'
          import os, re, subprocess, sys

          base = os.environ["BASE_SHA"]
          changed = subprocess.run(["git", "diff", "--name-only", f"{base}...HEAD"],
                                   capture_output=True, text=True, check=True).stdout.split()
          print("變更檔案:", *changed, sep="\n  ")

          # 會影響使用者行為的路徑：改到就必須發新版
          content = [f for f in changed
                     if f == "SKILL.md" or f.startswith(("scripts/", "references/", "resources/"))]
          if not content:
              print("只動到文件或 CI，不要求 bump VERSION。")
              sys.exit(0)

          def key(v):
              base_v, _, pre = v.partition("-")
              return (tuple(int(x) for x in base_v.split(".")), 0 if pre else 1, pre)

          new = open("VERSION", encoding="utf-8-sig").read().split()[0]
          old = subprocess.run(["git", "show", f"{base}:VERSION"], capture_output=True,
                               text=True, check=True).stdout.split()[0]
          errors = []
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?", new):
              errors.append(f"VERSION「{new}」不是 semver（X.Y.Z）")
          elif key(new) <= key(old):
              errors.append(f"改到 Skill 內容（{', '.join(content)}）但 VERSION 沒有前進："
                            f"main 是 {old}，這個 PR 是 {new}")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          if not re.search(rf"^## {re.escape(new)}\b", changelog, re.M):
              errors.append(f"CHANGELOG.md 缺少「## {new}」這一節")
          if errors:
              print("\n".join("::error::" + e for e in errors))
              sys.exit(1)
          print(f"OK：{old} → {new}")
          EOF
